
{% extends "base.html" %}

{% block title %}Cadastro{% endblock %}

{% block content %}
    <h1>Criar conta</h1>

    {% if erro %}
        <p class="erro">{{ erro }}</p>
    {% endif %}

    <form action="{{ url_for('cadastro') }}" method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" value="{{ nome }}" maxlength="100" required>

        <br><br>

        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email" value="{{ email }}" maxlength="254" required>

        <br><br>

        <label for="senha">Senha:</label>
        <input type="password" id="senha" name="senha" minlength="8" required>

        <br><br>

        <button type="submit">Cadastrar</button>
    </form>

    <p>Já possui uma conta? <a href="{{ url_for('login') }}">Entrar</a></p>
{% endblock %}
